<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Advanced CSS & JavaScript</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 20px;
    }

    h1, h2 {
      text-align: center;
      color: #333;
    }

    .carousel {
      max-width: 600px;
      margin: 30px auto;
      position: relative;
    }

    .carousel img {
      width: 100%;
      border-radius: 10px;
    }

    .api-box {
      max-width: 600px;
      margin: 30px auto;
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    button {
      padding: 10px 15px;
      font-size: 16px;
      background: #007BFF;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 24px;
      }
      .carousel img {
        height: auto;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 10px;
      }
      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <h1>Advanced CSS & JavaScript Task</h1>

  <!-- Image Carousel -->
  <div class="carousel">
    <img id="carouselImage" src="https://placekitten.com/600/300" alt="carousel image">
  </div>

  <!-- API Fetch Example -->
  <div class="api-box">
    <h2>Get a Random Joke</h2>
    <p id="joke">Click the button to fetch a joke.</p>
    <button onclick="getJoke()">Fetch Joke</button>
  </div>

  <script>
    // Image Carousel
    const images = [
      'https://placekitten.com/600/300',
      'https://placekitten.com/601/300',
      'https://placekitten.com/602/300'
    ];
    let index = 0;
    const imgElement = document.getElementById("carouselImage");

    setInterval(() => {
      index = (index + 1) % images.length;
      imgElement.src = images[index];
    }, 3000);

    // Fetch API - Joke
    function getJoke() {
      fetch("https://icanhazdadjoke.com/", {
        headers: {
          "Accept": "application/json"
        }
      })
      .then(response => response.json())
      .then(data => {
        document.getElementById("joke").textContent = data.joke;
      })
      .catch(err => {
        document.getElementById("joke").textContent = "Failed to fetch joke.";
        console.error(err);
      });
    }
  </script>

</body>
</html>
